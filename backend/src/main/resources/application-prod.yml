spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 3000ms

logging:
  level:
    com.harithafashion: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
    root: WARN
  file:
    name: ${LOG_FILE:/var/log/haritha/app.log}
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30

server:
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:20}
    max-connections: 8192
    accept-count: 100

management:
  health:
    mail:
      enabled: false   # don't mark the app unhealthy when SMTP is unreachable
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:https://harithafashionworld.com,https://www.harithafashionworld.com}
  frontend-url: ${FRONTEND_URL:https://harithafashionworld.com}

scheduler:
  abandoned-cart:
    enabled: true
  stock-alerts:
    enabled: true
  seller-payouts:
    enabled: true
  wishlist-price-drop:
    enabled: true
  order-expiry:
    enabled: true
